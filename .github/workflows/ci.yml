name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run offline security checks
        run: npm run check
      - name: Validate sample TOML
        run: node -e "import('./scripts/lib/config.mjs').then(x => {if(x.settings.allowExisting || x.settings.allowJS) process.exit(1)})"
      - name: Verify Windows one-click setup offline
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/setup-windows.ps1
      - name: Verify Unix entry syntax and read-only preflight
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh -n setup.sh install.sh setup.command
          sh setup.sh --check
