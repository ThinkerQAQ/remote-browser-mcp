# Loaded by scripts/proxy.mjs; override with gitignored config.toml.
# Never expose the CDP port to a public network.
[browser]
# edge (default) or chrome; optional user_data_dir for a custom local profile.
name = "edge"
endpoint = "http://127.0.0.1:9222"

[security]
# Opt-in overrides: default keeps existing user tabs protected.
allow_existing_pages = false
allow_javascript = false
